# Builds a universal macOS coolc and publishes it as a GitHub release.
# Runs when a version tag is pushed: git tag 0.1.0 && git push origin 0.1.0

name: Release

on:
  push:
    tags: [ "[0-9]+.[0-9]+.[0-9]+" ]

permissions:
  contents: write

jobs:
  release:

    runs-on: macos-latest

    steps:
    - uses: swift-actions/setup-swift@v3
    - uses: actions/checkout@v4

    - name: Run tests
      run: swift test

    - name: Build universal binary
      run: |
        swift build -c release --product CoolSwift --arch arm64 --arch x86_64
        BIN_PATH=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)
        mkdir -p dist
        cp "$BIN_PATH/CoolSwift" dist/coolc
        lipo -info dist/coolc

    - name: Smoke test
      run: |
        cp Examples/hello-world.cl "$RUNNER_TEMP/"
        cd "$RUNNER_TEMP"
        "$GITHUB_WORKSPACE/dist/coolc" hello-world.cl
        test "$(./hello-world)" = "Hello, world."

    - name: Package
      run: ditto -c -k --keepParent dist/coolc "coolc-$GITHUB_REF_NAME-macos.zip"

    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cat > "$RUNNER_TEMP/notes.md" <<'EOF'
        ## Install

        1. Download `coolc-<version>-macos.zip` and unzip it. It runs on Apple Silicon and Intel Macs.
        2. The binary isn't notarized, so clear the quarantine flag once:
           `xattr -d com.apple.quarantine coolc`
        3. Compiling programs needs clang, from Xcode or the Command Line Tools (`xcode-select --install`).

        ## Usage

        - `./coolc program.cl` builds the executable `./program`.
        - `./coolc program.cl --emit-ir` writes the LLVM IR to `program.ll` instead.
        EOF

        gh release create "$GITHUB_REF_NAME" "coolc-$GITHUB_REF_NAME-macos.zip" \
          --title "coolc $GITHUB_REF_NAME" \
          --verify-tag \
          --generate-notes \
          --notes "$(cat "$RUNNER_TEMP/notes.md")"
